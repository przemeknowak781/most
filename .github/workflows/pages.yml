name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish the site only: the working notes (*.md, docs/) and the repo
      # plumbing stay out of the public build.
      - name: Stage site files
        run: |
          mkdir _site
          git ls-files -z \
            | grep -zv -E '(\.md$|^docs/|^\.github/|^\.gitignore$)' \
            | xargs -0 cp --parents -t _site

      # Ship the stylesheet and scripts without comments and whitespace (about
      # half the transfer size). The sources in the repo stay readable; the
      # rendered pages are pixel-identical to the unminified build.
      - name: Minify CSS and JS
        working-directory: _site
        run: |
          npx --yes esbuild@0.24.0 styles.css --minify --outfile=styles.css --allow-overwrite --log-level=warning
          npx --yes esbuild@0.24.0 script.js copy-review.js --minify --outdir=. --allow-overwrite --log-level=warning

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
